<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golf Darts</title>
  <meta name="description" content="Sleek Golf Darts scorekeeper with multiplayer support, history, and vertical leaderboard." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07130b;
      --bg-card: rgba(18, 38, 25, 0.65);
      --bg-card-border: rgba(74, 222, 128, 0.15);
      --panel-solid: #0d2214;
      --accent-green: #22c55e;
      --accent-emerald: #10b981;
      --accent-gold: #f59e0b;
      --accent-red: #ef4444;
      --text-main: #f0fdf4;
      --text-muted: #86efac;
      --text-dim: #4ade8080;
      --radius-lg: 20px;
      --radius-md: 12px;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      --font-main: 'Outfit', sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh;
      color: var(--text-main);
      font-family: var(--font-main);
      background: radial-gradient(circle at 50% 0%, #143820 0%, var(--bg-dark) 75%);
      background-attachment: fixed;
      overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: linear-gradient(rgba(34, 197, 94, 0.03) 1px, transparent 1px),
                  linear-gradient(90deg, rgba(34, 197, 94, 0.03) 1px, transparent 1px);
      background-size: 32px 32px; z-index: 0;
    }
    .shell {
      position: relative; z-index: 1;
      width: min(1400px, calc(100% - 32px));
      margin: 0 auto; padding: 24px 0 48px;
    }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 24px; background: var(--bg-card);
      backdrop-filter: blur(16px); border: 1px solid var(--bg-card-border);
      border-radius: var(--radius-lg); margin-bottom: 24px; box-shadow: var(--shadow);
    }
    .brand { display: flex; align-items: center; gap: 16px; }
    .brand-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-emerald));
      border-radius: 14px; display: grid; place-items: center;
      font-size: 1.6rem; box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
    }
    .brand-copy h1 {
      margin: 0; font-family: var(--font-display);
      font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(to right, #ffffff, var(--text-muted));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand-copy p { margin: 2px 0 0; color: var(--text-muted); font-size: 0.85rem; opacity: 0.8; }
    .header-actions { display: flex; gap: 10px; }
    .panel {
      background: var(--bg-card); backdrop-filter: blur(16px);
      border: 1px solid var(--bg-card-border); border-radius: var(--radius-lg);
      box-shadow: var(--shadow); overflow: hidden;
    }
    .panel-inner { padding: 24px; }
    .hidden { display: none !important; }
    button {
      border: 0; cursor: pointer; font-family: var(--font-main);
      font-weight: 600; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0) scale(0.98); }
    .btn {
      padding: 12px 20px; border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main); font-size: 0.95rem;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.1); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-green), #16a34a);
      color: #022c22; font-weight: 700; box-shadow: 0 8px 20px rgba(34, 197, 94, 0.25);
    }
    .btn-primary:hover {
      box-shadow: 0 12px 24px rgba(34, 197, 94, 0.35);
      background: linear-gradient(135deg, #4ade80, var(--accent-green));
    }
    .btn-alt {
      background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.3);
      color: var(--text-muted);
    }
    .btn-warn {
      background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .btn-good {
      background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }
    .field label {
      display: block; margin-bottom: 8px; color: var(--text-muted);
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700;
    }
    .field input, .field select {
      width: 100%; padding: 14px 16px; border-radius: var(--radius-md);
      border: 1px solid var(--bg-card-border); background: rgba(5, 15, 8, 0.6);
      color: var(--text-main); font-family: var(--font-main); font-size: 1rem; outline: none;
    }
    .field input:focus, .field select:focus {
      border-color: var(--accent-green); box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
    }
    .setup-layout { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 24px; }
    .player-list { display: grid; gap: 12px; margin-top: 16px; }
    .player-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
    .remove-player {
      width: 48px; height: 48px; border-radius: var(--radius-md);
      background: rgba(239, 68, 68, 0.15); color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3); font-size: 1.2rem;
    }
    .rules-card {
      padding: 20px; border-radius: var(--radius-md); background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--bg-card-border); margin-bottom: 20px;
    }
    .rules-card h4 { margin: 0 0 12px; color: var(--accent-green); font-family: var(--font-display); }
    .rules-card ul { margin: 0; padding-left: 18px; color: var(--text-muted); font-size: 0.88rem; }
    .rules-card li { margin-bottom: 6px; }
    .game-layout { display: grid; grid-template-columns: 1fr 380px; gap: 24px; }
    .meta-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .meta-box {
      padding: 14px; border-radius: var(--radius-md); background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--bg-card-border); text-align: center;
    }
    .meta-box .k {
      display: block; color: var(--text-muted); font-size: 0.68rem;
      text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; margin-bottom: 4px;
    }
    .meta-box .v { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; color: var(--text-main); }
    .dart-track { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .dart-slot {
      min-height: 64px; border-radius: var(--radius-md); border: 1px dashed var(--bg-card-border);
      background: rgba(0, 0, 0, 0.2); display: grid; place-items: center; text-align: center;
    }
    .dart-slot .n { display: block; color: var(--text-dim); font-size: 0.7rem; text-transform: uppercase; font-weight: 700; }
    .dart-slot .v { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; color: var(--accent-green); }
    .score-buttons-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
    .score-btn {
      padding: 16px 12px; border-radius: var(--radius-md); background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--bg-card-border); color: var(--text-main); display: flex; flex-direction: column;
      align-items: center; gap: 4px;
    }
    .score-btn .btn-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; }
    .score-btn .btn-sub { font-size: 0.78rem; color: var(--text-muted); }
    .score-btn:hover { background: rgba(34, 197, 94, 0.12); border-color: var(--accent-green); }
    .score-btn.btn-miss { grid-column: span 2; background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); color: #fca5a5; }
    .score-btn.btn-miss .btn-sub { color: #f87171; }
    .score-btn.btn-miss:hover { background: rgba(239, 68, 68, 0.2); }
    .action-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .announce {
      margin-top: 20px; padding: 14px 18px; border-radius: var(--radius-md);
      background: rgba(0, 0, 0, 0.3); border: 1px solid var(--bg-card-border);
      font-weight: 600; font-size: 0.9rem; text-align: center;
    }
    .vertical-score-container { overflow-x: auto; max-height: 700px; overflow-y: auto; }
    .vertical-score-table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: center; }
    .vertical-score-table th, .vertical-score-table td {
      padding: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      border-right: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.95rem;
    }
    .vertical-score-table th {
      position: sticky; top: 0; background: #0b1c11; font-family: var(--font-display);
      font-weight: 700; color: var(--text-muted); z-index: 10;
    }
    .vertical-score-table th.active-player {
      color: var(--accent-green); background: #102e1a; box-shadow: inset 0 -2px 0 var(--accent-green);
    }
    .vertical-score-table td.hole-col { font-weight: 700; color: var(--text-muted); background: rgba(0, 0, 0, 0.2); width: 70px; }
    .vertical-score-table tr.total-row td {
      position: sticky; bottom: 0; background: #08170e; font-family: var(--font-display);
      font-size: 1.2rem; font-weight: 700; color: var(--accent-gold); border-top: 2px solid var(--bg-card-border);
    }
    .cell-current-hole { background: rgba(245, 158, 11, 0.1) !important; }
    .score-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
    .score-1 { color: #f59e0b; }
    .score-2 { color: #10b981; }
    .score-3 { color: #34d399; }
    .score-4 { color: #a855f7; }
    .score-5 { color: #60a5fa; }
    .score-6 { color: #38bdf8; }
    .score-7 { color: #f3f4f6; }
    .score-8 { color: #f87171; }
    @media (max-width: 1024px) {
      .game-layout, .setup-layout { grid-template-columns: 1fr; }
      .meta-strip { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">⛳</div>
        <div class="brand-copy">
          <h1>Golf Darts</h1>
          <p>Sleek vertical scoring system</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-alt" id="leaderboardToggle">Leaderboard</button>
        <button class="btn" id="historyToggle">History</button>
      </div>
    </header>

    <!-- SETUP VIEW -->
    <main id="setupPanel" class="setup-layout">
      <section class="panel">
        <div class="panel-inner">
          <h2 style="margin:0 0 16px; font-family:var(--font-display); font-size:1.5rem;">Match Setup</h2>
          <div class="player-list" id="playerList"></div>
          <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; margin-top:20px;">
            <div class="field">
              <label for="boardType">Board Type</label>
              <select id="boardType">
                <option value="basic">Basic Board</option>
                <option value="quad">Quad Board</option>
              </select>
            </div>
            <div class="field">
              <label for="gameMode">Game Mode</label>
              <select id="gameMode">
                <option value="9">9 Holes (1–9)</option>
                <option value="18">18 Holes (1–18)</option>
              </select>
            </div>
            <div class="field">
              <label for="matchDate">Match Date</label>
              <input id="matchDate" type="date" />
            </div>
          </div>
          <div style="display:flex; gap:12px; margin-top:24px;">
            <button class="btn btn-alt" id="addPlayerBtn" type="button" style="flex:1;">+ Add Player</button>
            <button class="btn btn-primary" id="startGameBtn" style="flex:2;">Start Match</button>
          </div>
        </div>
      </section>
      <aside class="panel">
        <div class="panel-inner">
          <div class="rules-card">
            <h4>Rules & Scoring</h4>
            <ul id="rulesList"></ul>
          </div>
          <div id="historyPanel">
            <h3 style="margin:0 0 12px; font-family:var(--font-display); font-size:1.2rem; color:var(--text-muted);">Match History</h3>
            <div id="historyList" style="display:grid; gap:8px; max-height:280px; overflow-y:auto;"></div>
          </div>
        </div>
      </aside>
    </main>

    <!-- GAMEPLAY VIEW -->
    <section id="gameArea" class="game-layout hidden">
      <section class="panel">
        <div class="panel-inner">
          <div class="meta-strip">
            <div class="meta-box">
              <span class="k">Player</span>
              <span class="v" id="currentPlayerLabel" style="color:var(--accent-green);">—</span>
            </div>
            <div class="meta-box">
              <span class="k">Mode</span>
              <span class="v" id="modeLabel">9 Holes</span>
            </div>
            <div class="meta-box">
              <span class="k">Target Hole</span>
              <span class="v" id="holeLabel" style="color:var(--accent-gold);">1</span>
            </div>
            <div class="meta-box">
              <span class="k">Dart</span>
              <span class="v" id="dartLabel">1 / 3</span>
            </div>
          </div>

          <div class="dart-track">
            <div class="dart-slot"><div><span class="n">Dart 1</span><span class="v" id="dart1View">—</span></div></div>
            <div class="dart-slot"><div><span class="n">Dart 2</span><span class="v" id="dart2View">—</span></div></div>
            <div class="dart-slot"><div><span class="n">Dart 3</span><span class="v" id="dart3View">—</span></div></div>
          </div>

          <!-- Direct Segment Score Input Buttons -->
          <div class="score-buttons-grid">
            <button class="score-btn" data-shot="double">
              <span class="btn-title">Double</span>
              <span class="btn-sub" id="sub-double">1 Pt</span>
            </button>
            <button class="score-btn quad-only hidden" data-shot="bull">
              <span class="btn-title">Bull</span>
              <span class="btn-sub">1 Pt</span>
            </button>
            <button class="score-btn" data-shot="triple">
              <span class="btn-title">Triple</span>
              <span class="btn-sub" id="sub-triple">2 Pts</span>
            </button>
            <button class="score-btn" data-shot="single">
              <span class="btn-title">Single</span>
              <span class="btn-sub" id="sub-single">3 Pts</span>
            </button>
            <button class="score-btn btn-miss" data-shot="miss">
              <span class="btn-title">Miss</span>
              <span class="btn-sub" id="sub-miss">5 Pts</span>
            </button>
          </div>

          <div class="action-row">
            <button class="btn btn-warn" id="undoBtn">Undo</button>
            <button class="btn btn-alt" id="advanceHoleBtn">Submit / Next Hole</button>
            <button class="btn btn-good" id="confirmNextBtn">Confirm Turn</button>
          </div>

          <div class="announce" id="statusMessage">Game Started. Ready for Dart 1!</div>
        </div>
      </section>

      <!-- VERTICAL SCOREBOARD LEADERBOARD -->
      <aside class="panel">
        <div class="panel-inner" style="padding: 12px;">
          <h3 style="margin: 0 0 12px; font-family: var(--font-display); font-size: 1.2rem; color: var(--text-muted); text-align: center;">
            Leaderboard
          </h3>
          <div class="vertical-score-container">
            <table class="vertical-score-table" id="scoreboardTable">
              <thead>
                <tr id="scoreboardHeader">
                  <th class="hole-col">Hole</th>
                </tr>
              </thead>
              <tbody id="scoreboardBody"></tbody>
              <tfoot>
                <tr class="total-row" id="scoreboardFooter">
                  <td class="hole-col">Total</td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      </aside>
    </section>
  </div>

  <script>
    // GAME STATE
    const state = {
      players: ['Player 1', 'Player 2'],
      boardType: 'basic',
      gameMode: 9,
      matchDate: new Date().toISOString().split('T')[0],
      currentHoleIndex: 0,
      currentPlayerIndex: 0,
      currentDart: 1,
      turnDarts: [],
      scores: {}, // { playerName: [hole1Score, hole2Score, ...] }
      history: []
    };

    // DOM ELEMENTS
    const setupPanel = document.getElementById('setupPanel');
    const gameArea = document.getElementById('gameArea');
    const playerList = document.getElementById('playerList');
    const boardTypeSelect = document.getElementById('boardType');
    const gameModeSelect = document.getElementById('gameMode');
    const matchDateInput = document.getElementById('matchDate');
    const addPlayerBtn = document.getElementById('addPlayerBtn');
    const startGameBtn = document.getElementById('startGameBtn');
    const rulesList = document.getElementById('rulesList');
    const historyList = document.getElementById('historyList');

    const currentPlayerLabel = document.getElementById('currentPlayerLabel');
    const modeLabel = document.getElementById('modeLabel');
    const holeLabel = document.getElementById('holeLabel');
    const dartLabel = document.getElementById('dartLabel');
    const dart1View = document.getElementById('dart1View');
    const dart2View = document.getElementById('dart2View');
    const dart3View = document.getElementById('dart3View');
    const statusMessage = document.getElementById('statusMessage');

    const scoreboardHeader = document.getElementById('scoreboardHeader');
    const scoreboardBody = document.getElementById('scoreboardBody');
    const scoreboardFooter = document.getElementById('scoreboardFooter');

    // INITIALIZATION
    function init() {
      matchDateInput.value = state.matchDate;
      renderPlayerInputs();
      renderRules();
      updateQuadVisibility();
      
      boardTypeSelect.addEventListener('change', (e) => {
        state.boardType = e.target.value;
        renderRules();
        updateQuadVisibility();
      });

      addPlayerBtn.addEventListener('click', () => {
        state.players.push(`Player ${state.players.length + 1}`);
        renderPlayerInputs();
      });

      startGameBtn.addEventListener('click', startGame);

      document.querySelectorAll('.score-btn').forEach(btn => {
        btn.addEventListener('click', () => handleShotInput(btn.dataset.shot));
      });

      document.getElementById('undoBtn').addEventListener('click', handleUndo);
      document.getElementById('advanceHoleBtn').addEventListener('click', forceAdvanceHole);
      document.getElementById('confirmNextBtn').addEventListener('click', confirmTurn);
    }

    function renderPlayerInputs() {
      playerList.innerHTML = '';
      state.players.forEach((pName, idx) => {
        const row = document.createElement('div');
        row.className = 'player-row';
        row.innerHTML = `
          <div class="field">
            <label>Player ${idx + 1}</label>
            <input type="text" value="${pName}" data-idx="${idx}" class="player-name-input" />
          </div>
          ${state.players.length > 1 ? `<button class="remove-player" type="button" data-idx="${idx}">✕</button>` : ''}
        `;
        playerList.appendChild(row);
      });

      document.querySelectorAll('.player-name-input').forEach(input => {
        input.addEventListener('input', (e) => {
          state.players[e.target.dataset.idx] = e.target.value;
        });
      });

      document.querySelectorAll('.remove-player').forEach(btn => {
        btn.addEventListener('click', (e) => {
          state.players.splice(e.target.dataset.idx, 1);
          renderPlayerInputs();
        });
      });
    }

    function renderRules() {
      if (state.boardType === 'quad') {
        rulesList.innerHTML = `
          <li>Double / Bull = 1 Pt (Hole in 1)</li>
          <li>Triple = 2 Pts (Eagle)</li>
          <li>Single = 3 Pts (Par)</li>
          <li>Miss = 5 Pts (Double Bogey)</li>
          <li>Lowest total score wins!</li>
        `;
      } else {
        rulesList.innerHTML = `
          <li>Double = 1 Pt (Hole in 1)</li>
          <li>Triple = 2 Pts (Eagle)</li>
          <li>Single = 3 Pts (Par)</li>
          <li>Miss = 5 Pts (Double Bogey)</li>
          <li>Lowest total score wins!</li>
        `;
      }
    }

    function updateQuadVisibility() {
      document.querySelectorAll('.quad-only').forEach(el => {
        if (state.boardType === 'quad') el.classList.remove('hidden');
        else el.classList.add('hidden');
      });
    }

    // GAMEPLAY CONTROLS
    function startGame() {
      state.gameMode = parseInt(gameModeSelect.value, 10);
      state.boardType = boardTypeSelect.value;
      state.currentHoleIndex = 0;
      state.currentPlayerIndex = 0;
      state.currentDart = 1;
      state.turnDarts = [];
      state.scores = {};

      state.players.forEach(p => {
        state.scores[p] = Array(state.gameMode).fill(null);
      });

      setupPanel.classList.add('hidden');
      gameArea.classList.remove('hidden');
      modeLabel.textContent = `${state.gameMode} Holes`;

      buildScoreboard();
      updateTurnUI();
    }

    function handleShotInput(shotType) {
      if (state.currentDart > 3) return;

      let scoreVal = 5;
      if (shotType === 'double' || shotType === 'bull') scoreVal = 1;
      else if (shotType === 'triple') scoreVal = 2;
      else if (shotType === 'single') scoreVal = 3;

      state.turnDarts.push({ type: shotType, val: scoreVal });
      
      if (state.currentDart === 1) dart1View.textContent = `${shotType.toUpperCase()} (${scoreVal})`;
      if (state.currentDart === 2) dart2View.textContent = `${shotType.toUpperCase()} (${scoreVal})`;
      if (state.currentDart === 3) dart3View.textContent = `${shotType.toUpperCase()} (${scoreVal})`;

      state.currentDart++;
      dartLabel.textContent = `${Math.min(state.currentDart, 3)} / 3`;

      if (state.currentDart > 3) {
        statusMessage.textContent = "3 Darts thrown! Click 'Confirm Turn' to lock in score.";
      }
    }

    function handleUndo() {
      if (state.turnDarts.length === 0) return;
      state.turnDarts.pop();
      state.currentDart--;

      if (state.currentDart === 1) dart1View.textContent = '—';
      if (state.currentDart === 2) dart2View.textContent = '—';
      if (state.currentDart === 3) dart3View.textContent = '—';

      dartLabel.textContent = `${state.currentDart} / 3`;
      statusMessage.textContent = "Last dart undone.";
    }

    function confirmTurn() {
      if (state.turnDarts.length === 0) {
        statusMessage.textContent = "Throw at least one dart or record a shot.";
        return;
      }

      // Best dart recorded for current hole
      const bestDartVal = Math.min(...state.turnDarts.map(d => d.val));
      const pName = state.players[state.currentPlayerIndex];
      state.scores[pName][state.currentHoleIndex] = bestDartVal;

      updateScoreboardCell(pName, state.currentHoleIndex, bestDartVal);
      nextPlayerOrHole();
    }

    function forceAdvanceHole() {
      const pName = state.players[state.currentPlayerIndex];
      if (state.turnDarts.length > 0) {
        confirmTurn();
        return;
      }
      // Default to miss if skipped
      state.scores[pName][state.currentHoleIndex] = 5;
      updateScoreboardCell(pName, state.currentHoleIndex, 5);
      nextPlayerOrHole();
    }

    function nextPlayerOrHole() {
      state.turnDarts = [];
      state.currentDart = 1;
      dart1View.textContent = '—';
      dart2View.textContent = '—';
      dart3View.textContent = '—';

      state.currentPlayerIndex++;
      if (state.currentPlayerIndex >= state.players.length) {
        state.currentPlayerIndex = 0;
        state.currentHoleIndex++;
      }

      if (state.currentHoleIndex >= state.gameMode) {
        endGame();
      } else {
        updateTurnUI();
      }
    }

    function updateTurnUI() {
      currentPlayerLabel.textContent = state.players[state.currentPlayerIndex];
      holeLabel.textContent = state.currentHoleIndex + 1;
      dartLabel.textContent = "1 / 3";
      statusMessage.textContent = `Target Hole ${state.currentHoleIndex + 1}. Ready!`;
      highlightActiveScoreboard();
    }

    // SCOREBOARD RENDERERS
    function buildScoreboard() {
      scoreboardHeader.innerHTML = '<th class="hole-col">Hole</th>';
      scoreboardFooter.innerHTML = '<td class="hole-col">Total</td>';
      scoreboardBody.innerHTML = '';

      state.players.forEach(pName => {
        const th = document.createElement('th');
        th.textContent = pName;
        th.id = `th-${pName.replace(/\s+/g, '-')}`;
        scoreboardHeader.appendChild(th);

        const td = document.createElement('td');
        td.textContent = '0';
        td.id = `total-${pName.replace(/\s+/g, '-')}`;
        scoreboardFooter.appendChild(td);
      });

      for (let h = 0; h < state.gameMode; h++) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="hole-col">${h + 1}</td>`;
        state.players.forEach(pName => {
          const td = document.createElement('td');
          td.id = `cell-${pName.replace(/\s+/g, '-')}-${h}`;
          td.textContent = '—';
          tr.appendChild(td);
        });
        scoreboardBody.appendChild(tr);
      }
    }

    function updateScoreboardCell(pName, holeIdx, scoreVal) {
      const cell = document.getElementById(`cell-${pName.replace(/\s+/g, '-')}-${holeIdx}`);
      if (cell) {
        cell.innerHTML = `<span class="score-badge score-${scoreVal}">${scoreVal}</span>`;
      }

      const totalCell = document.getElementById(`total-${pName.replace(/\s+/g, '-')}`);
      if (totalCell) {
        const playerTotal = state.scores[pName].reduce((acc, curr) => acc + (curr || 0), 0);
        totalCell.textContent = playerTotal;
      }
    }

    function highlightActiveScoreboard() {
      document.querySelectorAll('.vertical-score-table th').forEach(el => el.classList.remove('active-player'));
      document.querySelectorAll('.vertical-score-table td').forEach(el => el.classList.remove('cell-current-hole'));

      const activePName = state.players[state.currentPlayerIndex];
      const th = document.getElementById(`th-${activePName.replace(/\s+/g, '-')}`);
      if (th) th.classList.add('active-player');

      const cell = document.getElementById(`cell-${activePName.replace(/\s+/g, '-')}-${state.currentHoleIndex}`);
      if (cell) cell.classList.add('cell-current-hole');
    }

    // ==========================================
    // HELLCASTLE-RATING SYNC FUNCTION
    // ==========================================
    function syncGameToHellcastle(gameName, resultSummary) {
      const payload = {
        date: new Date().toISOString().split('T')[0],
        game: gameName,
        summary: resultSummary
      };

      fetch("https://script.google.com/macros/s/AKfycbwGPOZhC-PRsuwt-wZ70QRxnZLExtnVROtRpJx8jLqniyM79DxMVFsFkKqVHHMWOiVmkg/exec", {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      })
      .then(() => console.log("Sent payload to Hellcastle:", payload))
      .catch(err => console.warn("Hellcastle sync network error:", err));
    }

    function endGame() {
      // 1. Calculate totals for each player (Lowest total wins in Golf Darts)
      const playerResults = state.players.map(pName => {
        const totalScore = state.scores[pName].reduce((acc, curr) => acc + (curr || 0), 0);
        return { name: pName, total: totalScore };
      });

      // Sort low-to-high score
      playerResults.sort((a, b) => a.total - b.total);

      // Format match summary string (e.g. "Herb (24), Kelly (31), Pope (38)")
      const summaryText = playerResults.map(p => `${p.name} (${p.total})`).join(', ');

      // 2. Announce Winner on Local UI
      const winner = playerResults[0];
      statusMessage.textContent = `🏆 Match Finished! Winner: ${winner.name} (${winner.total} pts)`;

      // 3. Post background payload to Hellcastle-Rating
      syncGameToHellcastle("Golf Darts", summaryText);
    }

    // RUN ON LOAD
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
