<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golf Darts</title>
  <meta name="description" content="Sleek Golf Darts scorekeeper with multiplayer support, history, and vertical leaderboard." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07130b;
      --bg-card: rgba(18, 38, 25, 0.65);
      --bg-card-border: rgba(74, 222, 128, 0.15);
      --panel-solid: #0d2214;
      --accent-green: #22c55e;
      --accent-emerald: #10b981;
      --accent-gold: #f59e0b;
      --accent-red: #ef4444;
      --text-main: #f0fdf4;
      --text-muted: #86efac;
      --text-dim: #4ade8080;
      --radius-lg: 20px;
      --radius-md: 12px;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      --font-main: 'Outfit', sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; color: var(--text-main);
      font-family: var(--font-main);
      background: radial-gradient(circle at 50% 0%, #143820 0%, var(--bg-dark) 75%);
      background-attachment: fixed; overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: linear-gradient(rgba(34, 197, 94, 0.03) 1px, transparent 1px),
                  linear-gradient(90deg, rgba(34, 197, 94, 0.03) 1px, transparent 1px);
      background-size: 32px 32px; z-index: 0;
    }
    .shell { position: relative; z-index: 1; width: min(1400px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 48px; }
    
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 24px; background: var(--bg-card); backdrop-filter: blur(16px);
      border: 1px solid var(--bg-card-border); border-radius: var(--radius-lg);
      margin-bottom: 24px; box-shadow: var(--shadow);
    }
    .brand { display: flex; align-items: center; gap: 16px; }
    .brand-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-emerald));
      border-radius: 14px; display: grid; place-items: center; font-size: 1.6rem;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
    }
    .brand-copy h1 {
      margin: 0; font-family: var(--font-display); font-size: 1.8rem; font-weight: 700;
      letter-spacing: -0.02em; background: linear-gradient(to right, #ffffff, var(--text-muted));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand-copy p { margin: 2px 0 0; color: var(--text-muted); font-size: 0.85rem; opacity: 0.8; }
    .header-actions { display: flex; gap: 10px; }

    .panel {
      background: var(--bg-card); backdrop-filter: blur(16px);
      border: 1px solid var(--bg-card-border); border-radius: var(--radius-lg);
      box-shadow: var(--shadow); overflow: hidden;
    }
    .panel-inner { padding: 24px; }
    .hidden { display: none !important; }

    button { border: 0; cursor: pointer; font-family: var(--font-main); font-weight: 600; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0) scale(0.98); }
    .btn { padding: 12px 20px; border-radius: var(--radius-md); background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-main); font-size: 0.95rem; }
    .btn:hover { background: rgba(255, 255, 255, 0.1); }
    .btn-primary { background: linear-gradient(135deg, var(--accent-green), #16a34a); color: #022c22; font-weight: 700; box-shadow: 0 8px 20px rgba(34, 197, 94, 0.25); }
    .btn-primary:hover { box-shadow: 0 12px 24px rgba(34, 197, 94, 0.35); background: linear-gradient(135deg, #4ade80, var(--accent-green)); }
    .btn-alt { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.3); color: var(--text-muted); }
    .btn-warn { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }
    .btn-good { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); color: #6ee7b7; }

    .field label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
    .field input, .field select { width: 100%; padding: 14px 16px; border-radius: var(--radius-md); border: 1px solid var(--bg-card-border); background: rgba(5, 15, 8, 0.6); color: var(--text-main); font-family: var(--font-main); font-size: 1rem; outline: none; }
    .field input:focus, .field select:focus { border-color: var(--accent-green); box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2); }

    .setup-layout { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 24px; }
    .player-list { display: grid; gap: 12px; margin-top: 16px; }
    .player-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
    .remove-player { width: 48px; height: 48px; border-radius: var(--radius-md); background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); font-size: 1.2rem; }
    .rules-card { padding: 20px; border-radius: var(--radius-md); background: rgba(0, 0, 0, 0.3); border: 1px solid var(--bg-card-border); margin-bottom: 20px; }
    .rules-card h4 { margin: 0 0 12px; color: var(--accent-green); font-family: var(--font-display); }
    .rules-card ul { margin: 0; padding-left: 18px; color: var(--text-muted); font-size: 0.88rem; }
    .rules-card li { margin-bottom: 6px; }

    .game-layout { display: grid; grid-template-columns: 1fr 380px; gap: 24px; }
    .meta-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .meta-box { padding: 14px; border-radius: var(--radius-md); background: rgba(0, 0, 0, 0.3); border: 1px solid var(--bg-card-border); text-align: center; }
    .meta-box .k { display: block; color: var(--text-muted); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; margin-bottom: 4px; }
    .meta-box .v { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; color: var(--text-main); }
    .dart-track { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .dart-slot { min-height: 64px; border-radius: var(--radius-md); border: 1px dashed var(--bg-card-border); background: rgba(0, 0, 0, 0.2); display: grid; place-items: center; text-align: center; }
    .dart-slot .n { display: block; color: var(--text-dim); font-size: 0.7rem; text-transform: uppercase; font-weight: 700; }
    .dart-slot .v { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; color: var(--accent-green); }
    
    .score-buttons-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
    .score-btn { padding: 16px 12px; border-radius: var(--radius-md); background: rgba(255, 255, 255, 0.04); border: 1px solid var(--bg-card-border); color: var(--text-main); display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .score-btn .btn-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; }
    .score-btn .btn-sub { font-size: 0.78rem; color: var(--text-muted); }
    .score-btn:hover { background: rgba(34, 197, 94, 0.12); border-color: var(--accent-green); }
    .score-btn.btn-miss { grid-column: span 2; background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); color: #fca5a5; }
    .score-btn.btn-miss .btn-sub { color: #f87171; }
    .score-btn.btn-miss:hover { background: rgba(239, 68, 68, 0.2); }

    .action-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .announce { margin-top: 20px; padding: 14px 18px; border-radius: var(--radius-md); background: rgba(0, 0, 0, 0.3); border: 1px solid var(--bg-card-border); font-weight: 600; font-size: 0.9rem; text-align: center; }

    .vertical-score-container { overflow-x: auto; max-height: 700px; overflow-y: auto; }
    .vertical-score-table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: center; }
    .vertical-score-table th, .vertical-score-table td { padding: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); border-right: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.95rem; }
    .vertical-score-table th { position: sticky; top: 0; background: #0b1c11; font-family: var(--font-display); font-weight: 700; color: var(--text-muted); z-index: 10; }
    .vertical-score-table th.active-player { color: var(--accent-green); background: #102e1a; box-shadow: inset 0 -2px 0 var(--accent-green); }
    .vertical-score-table td.hole-col { font-weight: 700; color: var(--text-muted); background: rgba(0, 0, 0, 0.2); width: 70px; }
    .vertical-score-table tr.total-row td { position: sticky; bottom: 0; background: #08170e; font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; color: var(--accent-gold); border-top: 2px solid var(--bg-card-border); }
    .cell-current-hole { background: rgba(245, 158, 11, 0.1) !important; }
    .score-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
    .score-1 { color: #f59e0b; }
    .score-2 { color: #10b981; }
    .score-3 { color: #34d399; }
    .score-4 { color: #a855f7; }
    .score-5 { color: #60a5fa; }
    .score-6 { color: #38bdf8; }
    .score-7 { color: #f3f4f6; }
    .score-8 { color: #f87171; }

    @media (max-width: 1024px) {
      .game-layout, .setup-layout { grid-template-columns: 1fr; }
      .meta-strip { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">⛳</div>
        <div class="brand-copy">
          <h1>Golf Darts</h1>
          <p>Sleek vertical scoring system</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-alt" id="leaderboardToggle">Leaderboard</button>
        <button class="btn" id="historyToggle">History</button>
      </div>
    </header>

    <!-- SETUP VIEW -->
    <main id="setupPanel" class="setup-layout">
      <section class="panel">
        <div class="panel-inner">
          <h2 style="margin:0 0 16px; font-family:var(--font-display); font-size:1.5rem;">Match Setup</h2>
          <div class="player-list" id="playerList"></div>
          
          <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; margin-top:20px;">
            <div class="field">
              <label for="boardType">Board Type</label>
              <select id="boardType">
                <option value="basic">Basic Board</option>
                <option value="quad">Quad Board</option>
              </select>
            </div>
            <div class="field">
              <label for="gameMode">Game Mode</label>
              <select id="gameMode">
                <option value="9">9 Holes (1–9)</option>
                <option value="18">18 Holes (1–18)</option>
              </select>
            </div>
            <div class="field">
              <label for="matchDate">Match Date</label>
              <input id="matchDate" type="date" />
            </div>
          </div>

          <div style="display:flex; gap:12px; margin-top:24px;">
            <button class="btn btn-alt" id="addPlayerBtn" type="button" style="flex:1;">+ Add Player</button>
            <button class="btn btn-primary" id="startGameBtn" style="flex:2;">Start Match</button>
          </div>
        </div>
      </section>

      <aside class="panel">
        <div class="panel-inner">
          <div class="rules-card">
            <h4>Rules & Scoring</h4>
            <ul id="rulesList"></ul>
          </div>
          <div id="historyPanel">
            <h3 style="margin:0 0 12px; font-family:var(--font-display); font-size:1.2rem; color:var(--text-muted);">Match History</h3>
            <div id="historyList" style="display:grid; gap:8px; max-height:280px; overflow-y:auto;"></div>
          </div>
        </div>
      </aside>
    </main>

    <!-- GAMEPLAY VIEW -->
    <section id="gameArea" class="game-layout hidden">
      <section class="panel">
        <div class="panel-inner">
          <div class="meta-strip">
            <div class="meta-box">
              <span class="k">Player</span>
              <span class="v" id="currentPlayerLabel" style="color:var(--accent-green);">—</span>
            </div>
            <div class="meta-box">
              <span class="k">Mode</span>
              <span class="v" id="modeLabel">9 Holes</span>
            </div>
            <div class="meta-box">
              <span class="k">Target Hole</span>
              <span class="v" id="holeLabel" style="color:var(--accent-gold);">1</span>
            </div>
            <div class="meta-box">
              <span class="k">Dart</span>
              <span class="v" id="dartLabel">1 / 3</span>
            </div>
          </div>

          <div class="dart-track">
            <div class="dart-slot"><div><span class="n">Dart 1</span><span class="v" id="dart1View">—</span></div></div>
            <div class="dart-slot"><div><span class="n">Dart 2</span><span class="v" id="dart2View">—</span></div></div>
            <div class="dart-slot"><div><span class="n">Dart 3</span><span class="v" id="dart3View">—</span></div></div>
          </div>

          <!-- Direct Segment Score Input Buttons -->
          <div class="score-buttons-grid">
            <button class="score-btn" data-shot="double">
              <span class="btn-title">Double</span>
              <span class="btn-sub" id="sub-double">1 Pt</span>
            </button>

            <button class="score-btn quad-only hidden" data-shot="bull">
              <span class="btn-title">Bull</span>
              <span class="btn-sub">2 Pts</span>
            </button>

            <button class="score-btn" data-shot="triple">
              <span class="btn-title">Triple</span>
              <span class="btn-sub" id="sub-triple">2 Pts</span>
            </button>

            <button class="score-btn quad-only hidden" data-shot="quad">
              <span class="btn-title">Quad</span>
              <span class="btn-sub">4 Pts</span>
            </button>

            <button class="score-btn" data-shot="outer">
              <span class="btn-title">Outer Single</span>
              <span class="btn-sub" id="sub-outer">4 Pts</span>
            </button>

            <button class="score-btn quad-only hidden" data-shot="middle">
              <span class="btn-title">Middle Single</span>
              <span class="btn-sub">6 Pts</span>
            </button>

            <button class="score-btn" data-shot="inner">
              <span class="btn-title">Inner Single</span>
              <span class="btn-sub" id="sub-inner">3 Pts</span>
            </button>

            <button class="score-btn btn-miss" data-shot="miss">
              <span class="btn-title">Miss / Wrong Segment</span>
              <span class="btn-sub" id="sub-miss">5 Pts</span>
            </button>
          </div>

          <div class="action-row">
            <button class="btn" id="undoBtn">Undo</button>
            <button class="btn btn-good" id="finishHoleBtn">End Turn</button>
            <button class="btn btn-warn" id="newGameBtn">New Game</button>
          </div>
          <div class="announce" id="announcement">Ready to play.</div>
        </div>
      </section>

      <!-- Scoreboard Sidebar -->
      <aside class="panel">
        <div class="panel-inner" style="padding:16px;">
          <h3 style="margin:0 0 12px; font-family:var(--font-display); font-size:1.2rem; color:var(--text-muted); text-align:center;">Scorecard</h3>
          <div class="vertical-score-container">
            <table class="vertical-score-table">
              <thead>
                <tr id="verticalScoreHead">
                  <th class="hole-col">Hole</th>
                </tr>
              </thead>
              <tbody id="verticalScoreBody"></tbody>
            </table>
          </div>
        </div>
      </aside>
    </section>
  </div>

  <script>
    const STORAGE_KEYS = { history: "golf_darts_history_v1" };
    
    // Separate Point Maps per Board Type
    const BOARD_SCORING = {
      basic: {
        double: 1,
        triple: 2,
        inner: 3,
        outer: 4,
        miss: 5
      },
      quad: {
        double: 1,
        bull: 2,
        triple: 3,
        quad: 4,
        outer: 5,
        middle: 6,
        inner: 7,
        miss: 8
      }
    };

    const state = {
      boardType: "basic",
      players: [],
      totalHoles: 9,
      currentPlayer: 0,
      currentHole: 1,
      currentDart: 1,
      dartsThisTurn: [],
      started: false,
      gameOver: false,
      historyStack: []
    };

    const el = {
      playerList: document.getElementById("playerList"),
      addPlayerBtn: document.getElementById("addPlayerBtn"),
      startGameBtn: document.getElementById("startGameBtn"),
      boardType: document.getElementById("boardType"),
      gameMode: document.getElementById("gameMode"),
      matchDate: document.getElementById("matchDate"),
      setupPanel: document.getElementById("setupPanel"),
      gameArea: document.getElementById("gameArea"),
      currentPlayerLabel: document.getElementById("currentPlayerLabel"),
      modeLabel: document.getElementById("modeLabel"),
      holeLabel: document.getElementById("holeLabel"),
      dartLabel: document.getElementById("dartLabel"),
      dart1View: document.getElementById("dart1View"),
      dart2View: document.getElementById("dart2View"),
      dart3View: document.getElementById("dart3View"),
      undoBtn: document.getElementById("undoBtn"),
      finishHoleBtn: document.getElementById("finishHoleBtn"),
      newGameBtn: document.getElementById("newGameBtn"),
      announcement: document.getElementById("announcement"),
      verticalScoreHead: document.getElementById("verticalScoreHead"),
      verticalScoreBody: document.getElementById("verticalScoreBody"),
      historyList: document.getElementById("historyList"),
      rulesList: document.getElementById("rulesList"),
      quadButtons: document.querySelectorAll(".quad-only"),
      subDouble: document.getElementById("sub-double"),
      subTriple: document.getElementById("sub-triple"),
      subOuter: document.getElementById("sub-outer"),
      subInner: document.getElementById("sub-inner"),
      subMiss: document.getElementById("sub-miss"),
      scoreButtons: () => [...document.querySelectorAll("[data-shot]")]
    };

    function init() {
      el.matchDate.value = new Date().toISOString().slice(0, 10);
      addPlayerField("Player 1");
      addPlayerField("Player 2");
      bindEvents();
      renderHistory();
      toggleBoardTypeUI();
    }

    function addPlayerField(value = "") {
      const count = el.playerList.querySelectorAll(".player-row").length + 1;
      const row = document.createElement("div");
      row.className = "player-row";
      row.innerHTML = `
        <div class="field">
          <label>Player ${count}</label>
          <input type="text" maxlength="20" placeholder="Name" value="${value}">
        </div>
        <button class="remove-player" type="button">×</button>
      `;
      row.querySelector(".remove-player").addEventListener("click", () => {
        if (el.playerList.querySelectorAll(".player-row").length <= 1) return;
        row.remove();
        refreshPlayerLabels();
      });
      el.playerList.appendChild(row);
      refreshPlayerLabels();
    }

    function refreshPlayerLabels() {
      const rows = [...el.playerList.querySelectorAll(".player-row")];
      rows.forEach((row, idx) => {
        row.querySelector("label").textContent = `Player ${idx + 1}`;
      });
    }

    function toggleBoardTypeUI() {
      const isQuad = el.boardType.value === "quad";
      
      // Toggle Quad-only buttons
      el.quadButtons.forEach(b => b.classList.toggle("hidden", !isQuad));

      // Update button subtexts and rules list based on mode
      if (isQuad) {
        el.subDouble.textContent = "1 Pt";
        el.subTriple.textContent = "3 Pts";
        el.subOuter.textContent = "5 Pts";
        el.subInner.textContent = "7 Pts";
        el.subMiss.textContent = "8 Pts";

        el.rulesList.innerHTML = `
          <li><strong>Double:</strong> 1 Pt</li>
          <li><strong>Bull:</strong> 2 Pts</li>
          <li><strong>Triple:</strong> 3 Pts</li>
          <li><strong>Quad:</strong> 4 Pts</li>
          <li><strong>Outer Single:</strong> 5 Pts</li>
          <li><strong>Middle Single:</strong> 6 Pts</li>
          <li><strong>Inner Single:</strong> 7 Pts</li>
          <li><strong>Miss / Wrong Segment:</strong> 8 Pts</li>
        `;
      } else {
        el.subDouble.textContent = "1 Pt (Hole-in-One)";
        el.subTriple.textContent = "2 Pts (Eagle)";
        el.subInner.textContent = "3 Pts (Birdie)";
        el.subOuter.textContent = "4 Pts (Par)";
        el.subMiss.textContent = "5 Pts (Bogey)";

        el.rulesList.innerHTML = `
          <li><strong>Objective:</strong> Lowest total score wins.</li>
          <li><strong>3 Darts per Hole:</strong> Only your <em>best</em> single dart hit is kept for each hole.</li>
          <li><strong>Double:</strong> 1 Pt (Hole-in-One)</li>
          <li><strong>Triple:</strong> 2 Pts (Eagle)</li>
          <li><strong>Inner Single:</strong> 3 Pts (Birdie)</li>
          <li><strong>Outer Single:</strong> 4 Pts (Par)</li>
          <li><strong>Miss / Wrong Segment:</strong> 5 Pts (Bogey)</li>
        `;
      }
    }

    function bindEvents() {
      el.addPlayerBtn.addEventListener("click", () => addPlayerField());
      el.boardType.addEventListener("change", toggleBoardTypeUI);
      el.startGameBtn.addEventListener("click", startGame);
      el.newGameBtn.addEventListener("click", resetToSetup);
      el.finishHoleBtn.addEventListener("click", endTurn);
      el.undoBtn.addEventListener("click", undoLast);
      el.scoreButtons().forEach(btn => {
        btn.addEventListener("click", () => recordThrow(btn.dataset.shot));
      });
    }

    function startGame() {
      const names = [...el.playerList.querySelectorAll("input")]
        .map(i => i.value.trim())
        .filter(Boolean);
      if (names.length === 0) return;

      state.boardType = el.boardType.value;
      state.players = names.map(name => ({ name, scores: Array(18).fill(null), total: 0 }));
      state.totalHoles = parseInt(el.gameMode.value, 10);
      state.currentPlayer = 0;
      state.currentHole = 1;
      state.currentDart = 1;
      state.dartsThisTurn = [];
      state.historyStack = [];
      state.started = true;
      state.gameOver = false;

      toggleBoardTypeUI();
      el.setupPanel.classList.add("hidden");
      el.gameArea.classList.remove("hidden");
      updateDisplay();
      renderScorecard();
    }

    function recordThrow(shotType) {
      if (state.gameOver || state.currentDart > 3) return;
      pushStateToHistory();
      
      const activeScoring = BOARD_SCORING[state.boardType];
      const score = activeScoring[shotType];

      state.dartsThisTurn.push({ shotType, score });
      state.currentDart++;
      updateDisplay();
      if (state.currentDart > 3) {
        endTurn();
      }
    }

    function pushStateToHistory() {
      state.historyStack.push(JSON.stringify({
        players: state.players,
        currentPlayer: state.currentPlayer,
        currentHole: state.currentHole,
        currentDart: state.currentDart,
        dartsThisTurn: state.dartsThisTurn,
        gameOver: state.gameOver
      }));
    }

    function endTurn() {
      if (state.dartsThisTurn.length === 0) {
        const missScore = BOARD_SCORING[state.boardType].miss;
        state.dartsThisTurn.push({ shotType: "miss", score: missScore });
      }
      const bestScore = Math.min(...state.dartsThisTurn.map(d => d.score));
      const player = state.players[state.currentPlayer];
      player.scores[state.currentHole - 1] = bestScore;
      player.total = player.scores.reduce((a, b) => a + (b || 0), 0);

      state.dartsThisTurn = [];
      state.currentDart = 1;
      state.currentPlayer++;

      if (state.currentPlayer >= state.players.length) {
        state.currentPlayer = 0;
        state.currentHole++;
      }

      if (state.currentHole > state.totalHoles) {
        state.gameOver = true;
        announceWinner();
      }

      updateDisplay();
      renderScorecard();
    }

    function undoLast() {
      if (!state.historyStack || state.historyStack.length === 0) {
        el.announcement.textContent = "Nothing to undo!";
        return;
      }
      const previousState = JSON.parse(state.historyStack.pop());
      state.players = previousState.players;
      state.currentPlayer = previousState.currentPlayer;
      state.currentHole = previousState.currentHole;
      state.currentDart = previousState.currentDart;
      state.dartsThisTurn = previousState.dartsThisTurn;
      state.gameOver = previousState.gameOver;
      el.announcement.textContent = "Last dart undone.";
      updateDisplay();
      renderScorecard();
    }

    function updateDisplay() {
      if (state.gameOver) return;
      const p = state.players[state.currentPlayer];
      el.currentPlayerLabel.textContent = p.name;
      el.modeLabel.textContent = `${state.totalHoles} Holes (${state.boardType.toUpperCase()})`;
      el.holeLabel.textContent = state.currentHole;
      el.dartLabel.textContent = `${Math.min(state.currentDart, 3)} / 3`;
      el.dart1View.textContent = state.dartsThisTurn[0] ? state.dartsThisTurn[0].score : "—";
      el.dart2View.textContent = state.dartsThisTurn[1] ? state.dartsThisTurn[1].score : "—";
      el.dart3View.textContent = state.dartsThisTurn[2] ? state.dartsThisTurn[2].score : "—";
    }

    function renderScorecard() {
      let headHtml = `<th class="hole-col">Hole</th>`;
      state.players.forEach((p, idx) => {
        const isActive = idx === state.currentPlayer && !state.gameOver;
        headHtml += `<th class="${isActive ? 'active-player' : ''}">${p.name}</th>`;
      });
      el.verticalScoreHead.innerHTML = headHtml;

      let bodyHtml = "";
      for (let h = 1; h <= state.totalHoles; h++) {
        const isCurrentHole = h === state.currentHole && !state.gameOver;
        bodyHtml += `<tr class="${isCurrentHole ? 'cell-current-hole' : ''}">`;
        bodyHtml += `<td class="hole-col">${h}</td>`;
        state.players.forEach(p => {
          const score = p.scores[h - 1];
          if (score !== null) {
            bodyHtml += `<td><span class="score-badge score-${score}">${score}</span></td>`;
          } else {
            bodyHtml += `<td style="opacity:0.2;">—</td>`;
          }
        });
        bodyHtml += `</tr>`;
      }
      bodyHtml += `<tr class="total-row"><td class="hole-col">TOT</td>`;
      state.players.forEach(p => {
        bodyHtml += `<td>${p.total}</td>`;
      });
      bodyHtml += `</tr>`;
      el.verticalScoreBody.innerHTML = bodyHtml;
    }
function endGame() {
  // 1. Calculate final scores (Lowest score wins in Golf Darts)
  const sorted = [...state.players].sort((a, b) => a.total - b.total);
  const summaryText = sorted.map(p => `${p.name} (${p.total})`).join(', ');

  // 2. Display local winner UI
  if (typeof renderWinnerModal === "function") {
    renderWinnerModal(sorted[0]);
  }

  // 3. Trigger Hellcastle sync
  syncGameToHellcastle("Golf Darts", summaryText);
}
    function announceWinner() {
      const sorted = [...state.players].sort((a, b) => a.total - b.total);
      const winner = sorted[0];
      el.announcement.textContent = `🎉 Game Over! ${winner.name} wins with a score of ${winner.total}!`;
      saveHistory(winner);
      function endGame() {
 
  showWinnerModal(sortedPlayers[0].name);

 }
    }

    function saveHistory(winner) {
      const history = JSON.parse(localStorage.getItem(STORAGE_KEYS.history) || "[]");
      history.unshift({
        date: el.matchDate.value,
        winner: winner.name,
        score: winner.total,
        mode: `${state.totalHoles} Holes (${state.boardType})`
      });
      localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(history.slice(0, 10)));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem(STORAGE_KEYS.history) || "[]");
      el.historyList.innerHTML = history.length ? "" : "<div style='color:var(--text-dim); font-size:0.85rem;'>No past games.</div>";
      history.forEach(item => {
        const div = document.createElement("div");
        div.style.cssText = "padding:10px; background:rgba(0,0,0,0.2); border-radius:8px; font-size:0.85rem; display:flex; justify-content:space-between;";
        div.innerHTML = `<span><strong>${item.winner}</strong> (${item.score})</span><span style="color:var(--text-muted);">${item.date}</span>`;
        el.historyList.appendChild(div);
      });
    }

    function resetToSetup() {
      el.gameArea.classList.add("hidden");
      el.setupPanel.classList.remove("hidden");
    }

    init();
   function syncGameToHellcastle(gameName, resultSummary) {
  const payload = {
    date: new Date().toISOString().split('T')[0],
    game: gameName,
    summary: resultSummary // Use parameter name
  };

  fetch("https://script.google.com/macros/s/AKfycbwGPOZhC-PRsuwt-wZ70QRxnZLExtnVROtRpJx8jLqniyM79DxMVFsFkKqVHHMWOiVmkg/exec", {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(payload)
  })
  .then(() => console.log("Sent payload to Hellcastle:", payload))
  .catch(err => console.warn("Hellcastle sync network error:", err));
}
